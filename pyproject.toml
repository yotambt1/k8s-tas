[project]
name = "k8s-task-platform"
version = "0.1.0"
description = "Background image-resize service (FastAPI + Redis queue + worker) used as a Kubernetes learning project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.7",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskplatform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
