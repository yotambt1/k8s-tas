apiVersion: v1
kind: Service
metadata:
  name: task-api
  labels:
    {{- include "task-platform.labels" (dict "root" $ "app" "task-api" "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: task-api
  ports:
    - name: http
      port: {{ int .Values.api.service.port }}
      targetPort: http
