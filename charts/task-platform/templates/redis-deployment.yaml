apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "task-platform.labels" (dict "root" $ "app" "redis" "component" "redis") | nindent 4 }}
spec:
  # Exactly one replica: the AOF lives on a single ReadWriteOnce volume.
  # No strategy field, matching the live Deployment (default RollingUpdate).
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ include "task-platform.redisImage" . }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "task-platform.redisDataClaim" . }}
