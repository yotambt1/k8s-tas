apiVersion: v1
kind: Service
metadata:
  # The app's REDIS_URL and init container use this name as the hostname.
  name: redis
  labels:
    {{- include "task-platform.labels" (dict "root" $ "app" "redis" "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: {{ int .Values.redis.service.port }}
      targetPort: redis
